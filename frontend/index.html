<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GhostFleet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      /* Shown until the app loads: the same frame, so nothing jumps when it arrives. */
      html { background: #070b12; color: #e2e8f0; }
      body { margin: 0; }
      .boot-shell { display: grid; grid-template-rows: 44px 1fr; height: 100vh; font: 13px "IBM Plex Sans", system-ui, sans-serif; }
      .boot-brand { display: flex; align-items: center; padding: 0 16px; background: #0b111b; border-bottom: 1px solid #1a2433; font-weight: 600; }
      .boot-status { display: grid; place-items: center; color: #6d7a8d; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-shell" role="status" aria-label="Loading GhostFleet"><div class="boot-brand">GhostFleet</div><div class="boot-status">Starting GhostFleet…</div></div></div>
    <noscript>Enable JavaScript to use the interactive globe.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
